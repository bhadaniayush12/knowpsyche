<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260"><rect width="720" height="260" rx="20" fill="#F4F0E7"/><text x="360" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#242238">Go / no-go: use both colour and shape</text><circle cx="185" cy="124" r="40" fill="#376B62"/><text x="185" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#FFFFFF">✓</text><text x="185" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#242238">Green: respond</text><circle cx="535" cy="124" r="40" fill="#AF3C2D"/><text x="535" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#FFFFFF">×</text><text x="535" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#242238">Red X: hold back</text></svg>